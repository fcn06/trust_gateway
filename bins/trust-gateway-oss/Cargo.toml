[package]
name = "trust-gateway-oss"
version = "0.1.0"
edition = "2021"
description = "Sovereign Trust Gateway OSS binary — standalone MCP SSE + HTTP execution gateway"

[lib]
name = "trust_gateway_oss"
path = "src/lib.rs"

[[bin]]
name = "trust-gateway-oss"
path = "src/main.rs"

[[test]]
name = "conformance_suite"
path = "../../tests/conformance_suite.rs"

[dependencies]
trust-sdk = { workspace = true }
trust-engine = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
jwt-simple = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tower = { workspace = true, features = ["util"] }
sha2 = { workspace = true }
