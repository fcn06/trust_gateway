[package]
name = "nicp-contract-example"
version = "0.1.0"
edition = "2021"
description = "Demonstration of Negotiated Interaction Contracts (NICP) lifecycle, canonical hashing, and execution grant binding"

[dependencies]
trust-contract = { path = "../../crates/trust-contract" }
trust-model = { path = "../../crates/trust-model" }
trust-grants = { path = "../../crates/trust-grants" }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "rand_core"] }
rand = "0.8"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
