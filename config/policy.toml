# ─────────────────────────────────────────────────────────────
# Trust Gateway Policy Configuration
# ─────────────────────────────────────────────────────────────

[[rules]]
id = "demo-auto-allow-stripe-refund"
priority = 5
action_names = ["stripe_refund", "mock_refund"]
effect = "allow"

[[rules]]
id = "guest-read-only-auto-allow"
priority = 8
operation_kinds = ["read"]
session_tier = "guest"
effect = "allow"

[[rules]]
id = "guest-mutations-deny"
priority = 9
operation_kinds = ["create", "update", "delete", "financial_mutation"]
session_tier = "guest"
effect = "deny"
reason = "Personal agent in guest session cannot execute mutations. Customer account sign-in required."

[[rules]]
id = "read-actions-auto-allow"
priority = 10
operation_kinds = ["read"]
effect = "allow"

[[rules]]
id = "meta-tools-auto-allow"
priority = 11
action_names = [
    "switch_context", "list_bundles", "discover_agent_services", "call_b2b_agent", "register_b2b_agent", "list_registered_b2b_agents", "discover_b2b_agents",
    "reputation_inspect_counterparty", "contract_propose_or_amend", "contract_verify_and_activate", "receipt_present_and_store",
    "io.lianxi.reputation.inspect@v1", "io.lianxi.contract.propose_or_amend@v1", "io.lianxi.contract.activate@v1", "io.lianxi.receipt.vault@v1"
]
effect = "allow"

[[rules]]
id = "claw-native-tools-allow"
priority = 15
action_names = ["claw_hello_world", "claw_weather", "read_skill", "claw_extract_content_from_url"]
effect = "allow"

[[rules]]
id = "mcp-search-allow"
priority = 16
action_names = ["vp_search"]
categories = ["vp", "search"]
effect = "allow"

[[rules]]
id = "calendar-create-needs-approval"
priority = 20
action_names = ["google_calendar_create_event"]
effect = "require_approval"
tier = "tier1"
reason = "Calendar event creation requires portal approval"

[[rules]]
id = "shopify-order-update"
priority = 21
action_names = ["shopify_order_update"]
effect = "require_approval"
tier = "tier1"
reason = "Order modifications require portal approval"

[[rules]]
id = "refund-above-100eur"
priority = 30
action_names = ["shopify_order_refund_create"]
min_amount = "100.00 EUR"
effect = "require_approval"
tier = "tier2"
reason = "Refunds above €100 require re-authentication"

[[rules]]
id = "box-shop-checkout-approval"
priority = 25
action_names = ["box_shop_checkout"]
effect = "require_approval"
tier = "tier1"
reason = "Zero-credential checkout transactions require owner approval"

